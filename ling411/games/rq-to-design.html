<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From RQ to Design</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a projectable lesson tool. Tab bar on top; a stepper (walkthrough) and a grid builder (Latin square). Cool paper, ink-blue accent, one color per condition. */
:root {
  --bg: #F4F7F9; --surface: #FFFFFF; --ink: #18212C; --muted: #566273; --line: #D3DBE2;
  --accent: #2B59C3; --accent-ink: #FFFFFF; --mark: #FCE6A8; --mark-ink: #4A3600;
  --bad: #B3362F; --good: #237A5B;
  --c1: #2B59C3; --c2: #D0742A; --c3: #237A5B; --c4: #A8479A; --c5: #7A6A1E; --c6: #C2414B; --cf: #C9D1D9;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11161C; --surface: #19212A; --ink: #E5EAF0; --muted: #9AA6B4; --line: #2C3743;
  --accent: #82A6F4; --accent-ink: #0E1520; --mark: #574614; --mark-ink: #FBE7B0;
  --bad: #F08A80; --good: #6FD1A8;
  --c1: #82A6F4; --c2: #F0A15E; --c3: #5FC79C; --c4: #D98ACB; --c5: #CDBB62; --c6: #EE7F86; --cf: #3A4552;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11161C; --surface: #19212A; --ink: #E5EAF0; --muted: #9AA6B4; --line: #2C3743;
  --accent: #82A6F4; --accent-ink: #0E1520; --mark: #574614; --mark-ink: #FBE7B0;
  --bad: #F08A80; --good: #6FD1A8;
  --c1: #82A6F4; --c2: #F0A15E; --c3: #5FC79C; --c4: #D98ACB; --c5: #CDBB62; --c6: #EE7F86; --cf: #3A4552;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 1.125rem; line-height: 1.5; }
.wrap { max-width: 1100px; margin: 0 auto; padding-inline: 20px; padding-block: 20px 48px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: clamp(1.6rem, 3.2vw, 2.2rem); }
h2 { font-size: clamp(1.35rem, 2.6vw, 1.8rem); }
h3 { font-size: 1.15rem; }
p { margin: 0; }
.eyebrow { font-family: var(--f-mono); font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }

header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; margin-bottom: 18px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { font: 600 1rem var(--f-body); padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------- Walkthrough ---------- */
.stage { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: clamp(18px, 3vw, 32px); display: grid; gap: 22px; }
.stepbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dot { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); color: var(--muted); font: 600 .8rem var(--f-mono); cursor: pointer; display: grid; place-items: center; padding: 0; }
.dot.done { background: var(--line); color: var(--ink); }
.dot.now { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.nav { display: flex; gap: 8px; }
.btn { font: 600 1rem var(--f-body); padding: 9px 18px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: .4; cursor: default; }

.rq { font-family: var(--f-display); font-weight: 500; font-size: clamp(1.3rem, 2.8vw, 1.9rem); line-height: 1.35; text-wrap: pretty; }
.rq .chunk { border-radius: 6px; padding: 0 .2em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.rq .problem { background: var(--mark); color: var(--mark-ink); }
.rq .struck { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--muted); }
.rq .fixed { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--ink); }
.rq .tagn { font: 600 .7rem var(--f-mono); vertical-align: super; color: var(--mark-ink); background: var(--mark); border-radius: 4px; padding: 0 4px; margin-left: 2px; }

.slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.slot { border: 1.5px dashed var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; min-width: 0; }
.slot.filled { border-style: solid; border-color: var(--good); }
.slot.active { border-style: solid; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.slot .v { font-weight: 600; }
.slot .v.empty { color: var(--muted); font-weight: 400; font-style: italic; }

.explain { display: grid; gap: 10px; max-width: 70ch; }
.problems { display: grid; gap: 8px; padding: 0; margin: 0; list-style: none; }
.problems li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline; }
.problems .n { font: 600 .75rem var(--f-mono); background: var(--mark); color: var(--mark-ink); border-radius: 4px; padding: 1px 6px; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font: 600 .85rem var(--f-mono); padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.box { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 8px; min-width: 0; }
.box .label { font: 600 .78rem var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
svg text { fill: var(--muted); font-family: var(--f-mono); font-size: 11px; }
svg .axis { stroke: var(--line); }

.items { width: 100%; border-collapse: collapse; }
.tablewrap { overflow-x: auto; }
.items th, .items td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.items th { font: 600 .78rem var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.tr { font-weight: 600; font-size: 1.1rem; }
.gl { color: var(--muted); font-size: .95rem; font-style: italic; }
.verb { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; text-decoration-color: var(--accent); }
.cdot { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

.confounds { display: grid; gap: 10px; }
.cf { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.cf:last-child { border-bottom: 0; }
.cf .p { color: var(--bad); font-weight: 600; }
.cf .s { color: var(--good); font-weight: 600; }
@media (max-width: 620px) { .cf { grid-template-columns: 1fr; gap: 4px; } }

.nums { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.num { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.num b { display: block; font: 700 1.8rem var(--f-display); font-variant-numeric: tabular-nums; }
.num span { color: var(--muted); font-size: .95rem; }
.keyhint { font: .8rem var(--f-mono); color: var(--muted); }

/* ---------- Latin square ---------- */
.controls { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: end; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
.ctl { display: grid; gap: 4px; }
.ctl label { font: 600 .75rem var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.ctl select, .ctl input[type=range] { font: 1rem var(--f-body); }
.ctl select { padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { font: 600 .95rem var(--f-body); padding: 7px 12px; border: 0; background: var(--surface); color: var(--ink); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.rangeval { font: 600 1rem var(--f-mono); font-variant-numeric: tabular-nums; }

.lsgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; margin-top: 18px; align-items: start; }
@media (max-width: 820px) { .lsgrid { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; gap: 12px; min-width: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .95rem; }
.sq { overflow-x: auto; }
.sq table { border-collapse: separate; border-spacing: 3px; font-family: var(--f-mono); font-size: .8rem; }
.sq th { font-weight: 600; color: var(--muted); padding: 2px 6px; white-space: nowrap; }
.sq th.list { cursor: pointer; border-radius: 6px; }
.sq th.list.sel { background: var(--ink); color: var(--bg); }
.sq td { width: 34px; height: 24px; border-radius: 4px; text-align: center; color: #fff; font-weight: 600; }
:root .sq td { color: var(--surface); }
.sq td.dim { opacity: .28; }
.sq td.multi { width: auto; padding: 0 2px; background: transparent; }
.sq td.multi span { display: inline-block; width: 22px; height: 22px; line-height: 22px; border-radius: 4px; margin: 0 1px; color: var(--surface); }
.seq { display: flex; flex-wrap: wrap; gap: 4px; }
.seq span { font: 600 .72rem var(--f-mono); min-width: 34px; padding: 3px 4px; border-radius: 4px; text-align: center; color: var(--surface); }
.seq span.f { background: var(--cf); color: var(--ink); font-weight: 400; }
.verdict { border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; }
.verdict.ok { background: color-mix(in srgb, var(--good) 14%, transparent); }
.verdict.no { background: color-mix(in srgb, var(--bad) 14%, transparent); }
.verdict b { font-family: var(--f-display); }

@media (prefers-reduced-motion: no-preference) {
  .anim { animation: rise .35s ease-out; }
  @keyframes rise { from { transform: translateY(6px); opacity: .4; } to { transform: none; opacity: 1; } }
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div style="display:grid; gap:4px">
      <span class="eyebrow">LING 411 · Problem session</span>
      <h1>From research question to design</h1>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-walk" aria-selected="true" aria-controls="walk">Walkthrough</button>
      <button class="tab" role="tab" id="tab-latin" aria-selected="false" aria-controls="latin">Latin square</button>
    </div>
  </header>

  <section id="walk" role="tabpanel" aria-labelledby="tab-walk">
    <div class="stage">
      <div class="stepbar">
        <div class="dots" id="dots"></div>
        <div class="nav">
          <button class="btn" id="prev">Back</button>
          <button class="btn primary" id="next">Next</button>
        </div>
      </div>
      <div id="stepbody" class="anim"></div>
      <div class="keyhint">Arrow keys move between steps.</div>
    </div>
  </section>

  <section id="latin" role="tabpanel" aria-labelledby="tab-latin" hidden>
    <div class="controls">
      <div class="ctl">
        <label for="design">Design</label>
        <div class="seg" id="design">
          <button type="button" data-v="latin" aria-pressed="true">Latin square</button>
          <button type="button" data-v="all" aria-pressed="false">Everyone sees all versions</button>
        </div>
      </div>
      <div class="ctl">
        <label for="ncond">Conditions</label>
        <select id="ncond">
          <option value="2">2</option><option value="3">3</option>
          <option value="4" selected>4 (2×2)</option><option value="6">6 (2×3)</option>
        </select>
      </div>
      <div class="ctl">
        <label for="nitems">Items <span class="rangeval" id="nitemsv">24</span></label>
        <input type="range" id="nitems" min="4" max="48" step="4" value="24">
      </div>
      <div class="ctl">
        <label for="ratio">Fillers per item</label>
        <select id="ratio">
          <option value="0">None</option><option value="1">1:1</option>
          <option value="2" selected>1:2</option><option value="3">1:3</option>
        </select>
      </div>
    </div>

    <div class="lsgrid">
      <div class="panel">
        <div style="display:grid; gap:4px">
          <h3 id="sqtitle">Which item appears in which condition, per list</h3>
          <p class="muted" id="sqsub">Rows are items, columns are lists. Click a list to see what one participant gets.</p>
        </div>
        <div class="legend" id="legend"></div>
        <div class="sq" id="sq"></div>
      </div>
      <div class="panel">
        <div class="nums" id="nums"></div>
        <div id="verdict"></div>
        <div style="display:grid; gap:6px">
          <h3 id="seqtitle">One participant's trial order</h3>
          <p class="muted" id="seqsub"></p>
          <div class="seq" id="seq"></div>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
/* ---------------- shared data ---------------- */
const COND4 = [
  { id: "a", name: "Neutral · SOV" },
  { id: "b", name: "Neutral · OSV" },
  { id: "c", name: "Object given · SOV" },
  { id: "d", name: "Object given · OSV" },
];

/* ---------------- walkthrough ---------------- */
const SLOT_DEFS = [
  { k: "pop", label: "Population" },
  { k: "iv", label: "Independent variable (levels)" },
  { k: "task", label: "Task / method" },
  { k: "dv", label: "Dependent variable" },
];
const SLOT_VALUES = {
  pop: "Adult native speakers of Turkish",
  iv: "Word order: canonical SOV vs. scrambled OSV",
  task: "Self-paced reading, moving window",
  dv: "Reading time (ms) at the sentence-final verb",
};

function slotsHTML(filled, active) {
  return `<div class="slots">` + SLOT_DEFS.map(s => {
    const f = filled.includes(s.k);
    const cls = "slot" + (f ? " filled" : "") + (active === s.k ? " active" : "");
    return `<div class="${cls}"><span class="eyebrow">${s.label}</span><span class="v ${f ? "" : "empty"}">${f ? SLOT_VALUES[s.k] : "not specified"}</span></div>`;
  }).join("") + `</div>`;
}

/* The vague RQ with four chunks. state per chunk: problem | struck | fixed */
function vagueRQ(st) {
  const c = (key, text, n, fix) => {
    const s = st[key] || "problem";
    if (s === "problem") return `<span class="chunk problem">${text}</span><span class="tagn">${n}</span>`;
    if (s === "struck") return `<span class="chunk struck">${text}</span>`;
    return `<span class="chunk fixed">${fix}</span>`;
  };
  const pop = st.pop === "fixed" ? `<span class="chunk fixed">Among adult native speakers of Turkish,</span> d` : `${st.pop === "struck" ? "" : `<span class="chunk problem">[who?]</span><span class="tagn">1</span> `}D`;
  return `<p class="rq">${pop}oes ${c("iv", "sentence structure", 2, "word order (SOV vs. OSV)")} ${c("dv", "have a positive effect on", 4, "change the reading time (ms) at the verb in")} ${c("task", "reading", 3, "a self-paced reading task")}?</p>`;
}

function chart(title, data) {
  // data: {SOV:[neutral, given], OSV:[neutral, given]}  ms values
  const W = 300, H = 190, L = 44, R = 70, T = 16, B = 34;
  const y0 = 380, y1 = 520;
  const sy = v => T + (H - T - B) * (1 - (v - y0) / (y1 - y0));
  const xs = [L + 30, W - R - 10];
  let ticks = "";
  for (const v of [400, 450, 500]) ticks += `<line class="axis" x1="${L}" x2="${W - R + 10}" y1="${sy(v)}" y2="${sy(v)}" stroke-dasharray="2 3"/><text x="${L - 6}" y="${sy(v) + 4}" text-anchor="end">${v}</text>`;
  const line = (vals, col, lab) => `
    <polyline fill="none" stroke="${col}" stroke-width="3" points="${xs[0]},${sy(vals[0])} ${xs[1]},${sy(vals[1])}"/>
    <circle cx="${xs[0]}" cy="${sy(vals[0])}" r="5" fill="${col}"/><circle cx="${xs[1]}" cy="${sy(vals[1])}" r="5" fill="${col}"/>
    <text x="${xs[1] + 10}" y="${sy(vals[1]) + 4}" style="fill:${col};font-weight:600">${lab}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:360px" role="img" aria-label="${title}">
    ${ticks}
    <text x="${xs[0]}" y="${H - 12}" text-anchor="middle">Neutral</text>
    <text x="${xs[1]}" y="${H - 12}" text-anchor="middle">Object given</text>
    <text x="4" y="${T - 4}">ms</text>
    ${line(data.SOV, "var(--c1)", "SOV")}
    ${line(data.OSV, "var(--c2)", "OSV")}
  </svg>`;
}

const STEPS = [
  { // 1
    render: () => `
      <div class="explain">
        <span class="eyebrow">Step 1 · A vague research question</span>
        ${vagueRQ({})}
        <ul class="problems">
          <li><span class="n">1</span><span><b>No population.</b> Who are the readers?</span></li>
          <li><span class="n">2</span><span><b>"Sentence structure" is a concept, not a variable.</b> What are its levels?</span></li>
          <li><span class="n">3</span><span><b>"Reading" is not a method.</b> What do participants do, and how are sentences shown?</span></li>
          <li><span class="n">4</span><span><b>"Positive effect" is a value judgment.</b> What exactly do we measure?</span></li>
        </ul>
      </div>
      ${slotsHTML([], null)}`
  },
  { // 2
    render: () => `
      <div class="explain">
        <span class="eyebrow">Step 2 · Narrow the population</span>
        ${vagueRQ({ pop: "fixed" })}
        <p>Adult native speakers of Turkish. This also decides which word orders are possible and natural for the participants.</p>
      </div>
      ${slotsHTML(["pop"], "pop")}`
  },
  { // 3
    render: () => `
      <div class="explain">
        <span class="eyebrow">Step 3 · Turn the concept into a variable with levels</span>
        ${vagueRQ({ pop: "fixed", iv: "fixed" })}
        <p>"Sentence structure" becomes <b>word order</b> with two levels: canonical SOV <i>(Ali kitabı okudu)</i> and scrambled OSV <i>(Kitabı Ali okudu)</i>. The researcher chooses the level, so this is a manipulated independent variable.</p>
      </div>
      ${slotsHTML(["pop", "iv"], "iv")}`
  },
  { // 4
    render: () => `
      <div class="explain">
        <span class="eyebrow">Step 4 · Specify the task and presentation</span>
        ${vagueRQ({ pop: "fixed", iv: "fixed", task: "fixed" })}
        <p>Self-paced reading with a moving window: participants press a key to reveal each word, and the time between key presses is recorded.</p>
      </div>
      ${slotsHTML(["pop", "iv", "task"], "task")}`
  },
  { // 5
    render: () => `
      <div class="explain">
        <span class="eyebrow">Step 5 · Remove the value judgment and name the dependent variable</span>
        ${vagueRQ({ pop: "fixed", iv: "fixed", task: "fixed", dv: "fixed" })}
        <p>Instead of a "positive effect", we measure <b>reading time in milliseconds at the sentence-final verb</b>. The question no longer says which direction is good.</p>
      </div>
      ${slotsHTML(["pop", "iv", "task", "dv"], "dv")}`
  },
  { // 6
    render: () => `
      <div class="explain">
        <span class="eyebrow">Step 6 · The improved RQ</span>
        <p class="rq">Among adult native speakers of Turkish, is there a difference in reading times (in milliseconds) at the sentence-final verb between canonical SOV sentences and scrambled OSV sentences measured via a self-paced reading task?</p>
      </div>
      <div class="two">
        <div class="box">
          <span class="label">Research type</span>
          <div class="chips"><span class="chip">Descriptive</span><span class="chip">Correlational</span><span class="chip">Causal-comparative</span><span class="chip on">Experimental</span></div>
          <p>The researcher manipulates word order and controls the other properties of the sentences. Signal words: <i>difference … between</i>, which point to a cause-and-effect (control) question.</p>
        </div>
        <div class="box">
          <span class="label">Paradigm</span>
          <div class="chips"><span class="chip on">Quantitative</span><span class="chip">Qualitative</span><span class="chip">Mixed</span></div>
          <p>The answer is a comparison of numbers (ms) across conditions.</p>
        </div>
      </div>
      <p class="muted">Ask: is this RQ feasible, clear, significant, and ethical?</p>`
  },
  { // 7
    render: () => `
      <div class="explain">
        <span class="eyebrow">Step 7 · Design sheet rows 1–2: H, H′ and the factors</span>
        <p>With one factor, almost any account predicts that OSV is slower. To tell two accounts apart, add a second factor: the <b>context</b> before the sentence.</p>
      </div>
      <div class="two">
        <div class="box">
          <span class="label">Factor 1 · Word order</span><p>SOV vs. OSV</p>
          <span class="label">Factor 2 · Context</span><p>Neutral question vs. question that makes the object given</p>
        </div>
        <div class="box">
          <span class="label">2 × 2 = 4 conditions</span>
          <div style="display:grid; gap:4px">${COND4.map((c, i) => `<span><span class="cdot" style="background:var(--c${i + 1})"></span>${c.name}</span>`).join("")}</div>
        </div>
      </div>
      <div class="two">
        <div class="box">
          <span class="label">H · Syntactic cost</span>
          <p>OSV is harder to process in any context. Prediction: <b>main effect of word order, no interaction</b>.</p>
          ${chart("H prediction", { SOV: [420, 425], OSV: [500, 495] })}
        </div>
        <div class="box">
          <span class="label">H′ · Discourse fit</span>
          <p>OSV is harder only when the context does not support it. Prediction: <b>interaction</b>, the OSV cost shrinks in the given context.</p>
          ${chart("H′ prediction", { SOV: [420, 452], OSV: [500, 430] })}
        </div>
      </div>
      <p class="muted">The numbers in the plots are made up to show the shape of each prediction. H and H′ differ in the "object given" context.</p>`
  },
  { // 8
    render: () => `
      <div class="explain">
        <span class="eyebrow">Step 8 · Design sheet row 4: one item in all conditions</span>
        <p>The four versions differ only in the factors. The target sentence uses the same words in every condition.</p>
      </div>
      <div class="tablewrap"><table class="items">
        <thead><tr><th>Condition</th><th>Context question</th><th>Target sentence</th></tr></thead>
        <tbody>
          ${[
            ["Dün akşam ne oldu?", "What happened last night?", "Ali kitabı <span class=verb>okudu</span>.", "Ali read the book."],
            ["Dün akşam ne oldu?", "What happened last night?", "Kitabı Ali <span class=verb>okudu</span>.", "Ali read the book (OSV)."],
            ["Kitabı kim okudu?", "Who read the book?", "Ali kitabı <span class=verb>okudu</span>.", "Ali read the book."],
            ["Kitabı kim okudu?", "Who read the book?", "Kitabı Ali <span class=verb>okudu</span>.", "Ali read the book (OSV)."],
          ].map((r, i) => `<tr><td><span class="cdot" style="background:var(--c${i + 1})"></span>${COND4[i].name}</td><td><div class="tr">${r[0]}</div><div class="gl">${r[1]}</div></td><td><div class="tr">${r[2]}</div><div class="gl">${r[3]}</div></td></tr>`).join("")}
        </tbody>
      </table></div>
      <p class="muted">Underlined: the region where reading time is measured.</p>`
  },
  { // 9
    render: () => `
      <div class="explain">
        <span class="eyebrow">Step 9 · Design sheet row 5: confounds and how to control them</span>
      </div>
      <div class="confounds">
        ${[
          ["The word before the verb differs (<i>kitabı</i> vs. <i>Ali</i>). Slow reading of that word can spill over onto the verb.", "Add a region after the verb and analyze the verb and the next region. Match the subject and object words in length and frequency across items."],
          ["Bare objects cannot scramble freely in Turkish, so some items would be odd for a reason other than word order.", "Use definite, accusative-marked objects (<i>kitab-ı</i>) in every item."],
          ["Lexical: some verbs or nouns are simply read faster.", "Each item appears in all four conditions, so the same words are compared with themselves."],
          ["Participants may read without attention, or notice the word-order pattern.", "Add yes-no comprehension questions and many fillers with other structures."],
        ].map(r => `<div class="cf"><div><span class="p">Problem.</span> ${r[0]}</div><div><span class="s">Control.</span> ${r[1]}</div></div>`).join("")}
      </div>`
  },
  { // 10
    render: () => `
      <div class="explain">
        <span class="eyebrow">Step 10 · Design sheet rows 6–7: items, lists, fillers</span>
        <p>Each participant should see each item only once, and every condition equally often. With 4 conditions we need 4 lists (a Latin square).</p>
      </div>
      <div class="nums">
        <div class="num"><b>24</b><span>items, each written in 4 versions</span></div>
        <div class="num"><b>4</b><span>lists</span></div>
        <div class="num"><b>6</b><span>items per condition, per participant</span></div>
        <div class="num"><b>48</b><span>fillers (ratio 1:2)</span></div>
        <div class="num"><b>72</b><span>trials per participant, plus practice</span></div>
      </div>
      <div><button class="btn primary" id="toLatin">Open this design in the Latin square</button></div>`
  },
];

let step = 0;
const dotsEl = document.getElementById("dots");
const bodyEl = document.getElementById("stepbody");
function renderStep() {
  dotsEl.innerHTML = STEPS.map((_, i) => `<button class="dot ${i < step ? "done" : ""} ${i === step ? "now" : ""}" data-i="${i}" aria-label="Step ${i + 1}">${i + 1}</button>`).join("");
  bodyEl.innerHTML = `<div style="display:grid; gap:22px">${STEPS[step].render()}</div>`;
  bodyEl.classList.remove("anim"); void bodyEl.offsetWidth; bodyEl.classList.add("anim");
  document.getElementById("prev").disabled = step === 0;
  document.getElementById("next").disabled = step === STEPS.length - 1;
  const t = document.getElementById("toLatin");
  if (t) t.onclick = () => { setLatin({ n: 4, items: 24, ratio: 2, mode: "latin", sel: 0 }); showTab("latin"); };
}
dotsEl.addEventListener("click", e => { const b = e.target.closest(".dot"); if (b) { step = +b.dataset.i; renderStep(); } });
document.getElementById("prev").onclick = () => { if (step > 0) { step--; renderStep(); } };
document.getElementById("next").onclick = () => { if (step < STEPS.length - 1) { step++; renderStep(); } };
document.addEventListener("keydown", e => {
  if (document.getElementById("walk").hidden) return;
  if (["INPUT", "SELECT"].includes(document.activeElement?.tagName)) return;
  if (e.key === "ArrowRight" && step < STEPS.length - 1) { step++; renderStep(); }
  if (e.key === "ArrowLeft" && step > 0) { step--; renderStep(); }
});

/* ---------------- tabs ---------------- */
function showTab(name) {
  for (const t of ["walk", "latin"]) {
    document.getElementById(t).hidden = t !== name;
    document.getElementById("tab-" + t).setAttribute("aria-selected", t === name ? "true" : "false");
  }
  try { localStorage.setItem("ling411-tab", name); } catch (e) {}
}
document.getElementById("tab-walk").onclick = () => showTab("walk");
document.getElementById("tab-latin").onclick = () => showTab("latin");

/* ---------------- Latin square ---------------- */
const LS = { n: 4, items: 24, ratio: 2, mode: "latin", sel: 0 };
const LETTERS = "abcdef";
function condName(k, n) {
  if (n === 4) return COND4[k].name;
  if (n === 6) return ["F1a · F2a", "F1a · F2b", "F1a · F2c", "F1b · F2a", "F1b · F2b", "F1b · F2c"][k];
  return "Condition " + LETTERS[k].toUpperCase();
}
function rng(seed) { return () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }; }
function shuffle(arr, seed) { const r = rng(seed); const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function setLatin(p) { Object.assign(LS, p); syncControls(); renderLatin(); }
function syncControls() {
  document.getElementById("ncond").value = LS.n;
  const r = document.getElementById("nitems");
  r.step = LS.n === 3 || LS.n === 6 ? 6 : 4; r.min = LS.n === 3 || LS.n === 6 ? 6 : 4;
  r.max = LS.n === 3 || LS.n === 6 ? 48 : 48;
  r.value = LS.items;
  document.getElementById("nitemsv").textContent = LS.items;
  document.getElementById("ratio").value = LS.ratio;
  document.querySelectorAll("#design button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === LS.mode ? "true" : "false"));
}
function fixItems() { // keep items a multiple of conditions
  const step = LS.n === 3 || LS.n === 6 ? 6 : 4;
  LS.items = Math.max(step, Math.round(LS.items / step) * step);
  if (LS.items % LS.n) LS.items = Math.ceil(LS.items / LS.n) * LS.n;
}

function renderLatin() {
  const { n, items, ratio, mode } = LS;
  const col = k => `var(--c${k + 1})`;
  document.getElementById("legend").innerHTML = Array.from({ length: n }, (_, k) =>
    `<span><span class="cdot" style="background:${col(k)}"></span>${LETTERS[k]} = ${condName(k, n)}</span>`).join("");

  const sq = document.getElementById("sq");
  if (mode === "latin") {
    LS.sel = Math.min(LS.sel, n - 1);
    document.getElementById("sqtitle").textContent = "Which item appears in which condition, per list";
    document.getElementById("sqsub").textContent = "Rows are items, columns are lists. Each row and each column contains every condition. Click a list to see what one participant gets.";
    let h = `<table><thead><tr><th></th>${Array.from({ length: n }, (_, j) => `<th class="list ${j === LS.sel ? "sel" : ""}" data-j="${j}" tabindex="0">List ${j + 1}</th>`).join("")}</tr></thead><tbody>`;
    for (let i = 0; i < items; i++) {
      h += `<tr><th>Item ${i + 1}</th>`;
      for (let j = 0; j < n; j++) { const k = (i + j) % n; h += `<td class="${j === LS.sel ? "" : "dim"}" style="background:${col(k)}">${LETTERS[k]}</td>`; }
      h += `</tr>`;
    }
    sq.innerHTML = h + `</tbody></table>`;
    sq.querySelectorAll("th.list").forEach(th => {
      const go = () => { LS.sel = +th.dataset.j; renderLatin(); };
      th.onclick = go; th.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } };
    });
  } else {
    document.getElementById("sqtitle").textContent = "What every participant sees";
    document.getElementById("sqsub").textContent = "There is only one list. Every participant reads every item in every condition.";
    let h = `<table><thead><tr><th></th><th>Every participant</th></tr></thead><tbody>`;
    for (let i = 0; i < items; i++) h += `<tr><th>Item ${i + 1}</th><td class="multi">${Array.from({ length: n }, (_, k) => `<span style="background:${col(k)}">${LETTERS[k]}</span>`).join("")}</td></tr>`;
    sq.innerHTML = h + `</tbody></table>`;
  }

  // numbers
  const exp = mode === "latin" ? items : items * n;
  const fill = mode === "latin" ? items * ratio : 0;
  const perCond = mode === "latin" ? items / n : items;
  const lists = mode === "latin" ? n : 1;
  document.getElementById("nums").innerHTML = `
    <div class="num"><b>${lists}</b><span>${lists === 1 ? "list" : "lists"}</span></div>
    <div class="num"><b>${exp}</b><span>experimental trials</span></div>
    <div class="num"><b>${fill}</b><span>fillers</span></div>
    <div class="num"><b>${exp + fill}</b><span>trials per participant</span></div>
    <div class="num"><b>${perCond}</b><span>items per condition, per participant</span></div>
    <div class="num"><b>${mode === "latin" ? "×" + n : "any"}</b><span>participants needed (multiple of)</span></div>`;

  // verdict
  const v = document.getElementById("verdict");
  if (mode === "all") {
    v.innerHTML = `<div class="verdict no"><b>Problem (Part 1, Design 3)</b><span>Each participant reads the same sentence ${n} times. They can compare versions, guess the purpose, and later versions are affected by earlier ones. ${ratio === 0 ? "" : "Fillers are not added here, as in Design 3."}</span></div>`;
  } else if (ratio === 0) {
    v.innerHTML = `<div class="verdict no"><b>Lists are fine, but there are no fillers</b><span>Every trial is an experimental item, so participants may notice the pattern. Use a ratio of 1:2 or 1:3.</span></div>`;
  } else if (perCond < 4) {
    v.innerHTML = `<div class="verdict no"><b>Too few items per condition</b><span>Each participant sees only ${perCond} item${perCond === 1 ? "" : "s"} per condition. Add items so that each condition gets more observations.</span></div>`;
  } else {
    v.innerHTML = `<div class="verdict ok"><b>Balanced design</b><span>Each participant sees each item once, every condition ${perCond} times, and ${ratio} filler${ratio > 1 ? "s" : ""} for every experimental item.</span></div>`;
  }

  // sequence for selected list
  const seqEl = document.getElementById("seq");
  let trials = [];
  if (mode === "latin") {
    for (let i = 0; i < items; i++) { const k = (i + LS.sel) % n; trials.push({ t: `${i + 1}${LETTERS[k]}`, k }); }
  } else {
    for (let i = 0; i < items; i++) for (let k = 0; k < n; k++) trials.push({ t: `${i + 1}${LETTERS[k]}`, k });
  }
  for (let f = 0; f < fill; f++) trials.push({ t: `F${f + 1}`, k: -1 });
  trials = shuffle(trials, 7 + LS.sel * 31 + items + n * 3 + ratio);
  document.getElementById("seqtitle").textContent = mode === "latin" ? `One participant in List ${LS.sel + 1}: trial order` : "One participant: trial order";
  document.getElementById("seqsub").textContent = `Randomized order. "3b" means item 3 in condition b; F = filler.`;
  seqEl.innerHTML = trials.map(x => x.k < 0 ? `<span class="f">${x.t}</span>` : `<span style="background:${col(x.k)}">${x.t}</span>`).join("");
}

document.querySelectorAll("#design button").forEach(b => b.onclick = () => setLatin({ mode: b.dataset.v }));
document.getElementById("ncond").onchange = e => { LS.n = +e.target.value; fixItems(); syncControls(); renderLatin(); };
document.getElementById("nitems").oninput = e => { LS.items = +e.target.value; fixItems(); document.getElementById("nitemsv").textContent = LS.items; renderLatin(); };
document.getElementById("ratio").onchange = e => { LS.ratio = +e.target.value; renderLatin(); };

/* ---------------- boot ---------------- */
renderStep();
syncControls();
renderLatin();
let startTab = "walk";
if (location.hash === "#latin") startTab = "latin";
else { try { const s = localStorage.getItem("ling411-tab"); if (s === "latin" || s === "walk") startTab = s; } catch (e) {} }
showTab(startTab);
</script>
</body>
</html>
