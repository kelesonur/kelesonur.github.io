<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>İşaret Öğrenme Deneyi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/jspsych@8.2.1/dist/index.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@jspsych/plugin-html-keyboard-response@2.1.0/dist/index.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@jspsych/plugin-html-button-response@2.1.0/dist/index.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@jspsych/plugin-survey-html-form@2.1.0/dist/index.browser.min.js"></script>
<link rel="stylesheet" href="jspsych_stock.css">
<style>
:root{color-scheme:light}
html{background:#ffffff}
body{background:#ffffff;color:#000000;margin:0;font-family:"Open Sans","Arial",sans-serif}
#jspsych-target{min-height:100vh;box-sizing:border-box;padding:12px 16px 24px}
#skip{position:fixed;top:8px;right:8px;margin:0;z-index:5}
#skip[hidden]{display:none}
.instr{max-width:800px;width:100%;margin:0 auto;text-align:left}
.frame{font-size:30px;font-weight:700;line-height:1.3;min-height:1.3em;margin:0 0 14px}
.q{font-size:30px;font-weight:700;line-height:1.3;margin:0 0 10px}
.pair{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px 32px;margin-bottom:8px}
.pair figure{margin:0;display:flex;flex-direction:column;align-items:center}
.pair figcaption{font-size:16px;margin-top:4px}
.stage{width:320px;height:320px;margin:0 auto;display:flex;align-items:center;justify-content:center}
canvas.sg{width:320px;height:320px;display:block}
canvas.an{width:320px;height:246px;display:block}
video.cam{width:320px;height:240px;display:block;object-fit:cover;transform:scaleX(-1);background:#eeeeee}
.nocam{width:320px;height:240px;display:flex;align-items:center;justify-content:center;background:#eeeeee;font-size:16px}
.cd{font-size:30px;font-weight:700;line-height:1.3;min-height:1.3em;margin:12px 0}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:red;margin-right:8px;vertical-align:1px}
.jspsych-btn{min-height:44px;box-sizing:border-box}
.jspsych-btn-group-flex{flex-wrap:wrap}
.anim-btn{padding:6px;border-width:5px;border-color:#cccccc}
.anim-btn canvas{width:150px;height:115px;display:block}
.anim-btn.big canvas{width:220px;height:169px}
.fbbtn,.fbbtn:disabled{background-color:#ffffff;color:#333;cursor:default}
.fbk{font-size:30px;font-weight:700;line-height:1.3;margin:12px 0}
.fbk.ok{color:forestgreen}
.fbk.bad{color:red}
.score{font-size:18px;margin:4px 0}
.wait{font-size:20px;line-height:1.4;margin:64px 0 8px}
.form p{margin:14px 0 4px}
.form textarea,.form input[type=text]{width:100%;font-family:"Open Sans","Arial",sans-serif;font-size:16px;padding:6px;border:1px solid #aaaaaa;box-sizing:border-box}
.radios label{display:inline-block;margin-right:16px;cursor:pointer}
.req{color:red}
@media (max-width:600px){
  .frame,.q,.cd,.fbk{font-size:22px}
  .stage{width:260px;height:260px}
  canvas.sg{width:260px;height:260px}
  canvas.an{width:260px;height:200px}
  video.cam,.nocam{width:260px;height:195px}
  .anim-btn{padding:4px;margin:6px}
  .anim-btn canvas{width:128px;height:98px}
  .anim-btn.big canvas{width:140px;height:108px}
}
</style>
</head>
<body>
<button id="skip" class="jspsych-btn" type="button" hidden>Atla</button>
<div id="jspsych-target"></div>
<script src="draw.js"></script>
<script src="experiment.js"></script>
</body>
</html>
