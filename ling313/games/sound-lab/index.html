<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LING 313 Sound Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Figtree:wght@400;500;700;800&family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
/* Layout: a live "spectrogram" glows behind a single centered play column; levels sit on a 4-up grid with the boss round as a full-width band. Single dark theme by choice (a phonetics lab screen). */
:root {
  --ink: #120a1c;
  --ink-2: #1c1029;
  --panel: #241634;
  --panel-2: #2e1d42;
  --line: #43295a;
  --fg: #f7ede2;
  --muted: #bba8cb;
  --plum: #8a2a7d;
  --rose: #e0457b;
  --ember: #f57d3c;
  --gold: #fcd36a;
  --good: #6fdcae;
  --bad: #ff7482;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ipa: "Gentium Book Plus", "Charis SIL", "Doulos SIL", "Noto Serif", "Times New Roman", serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--fg); font-family: var(--ui); font-size: 16px; line-height: 1.5; }
#spec { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; opacity: .42; filter: blur(3px) saturate(1.15); }
.shade { position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: linear-gradient(to bottom, color-mix(in srgb, var(--ink) 15%, transparent) 0%, color-mix(in srgb, var(--ink) 70%, transparent) 38%, var(--ink) 78%); }
.app { position: relative; z-index: 1; max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 56px; }

button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.ipa { font-family: var(--ipa); }
.w { font-family: var(--ipa); font-style: italic; }

/* top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; justify-content: space-between; padding-block: 4px 18px; }
.brand { display: flex; align-items: baseline; gap: 10px; cursor: pointer; background: none; border: 0; padding: 0; }
.brand b { font-family: var(--display); font-weight: 900; font-size: 1.15rem; letter-spacing: .02em; }
.brand span { color: var(--muted); font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; }
.top-right { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.scores { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: .85rem; font-variant-numeric: tabular-nums; }
.chip strong { font-family: var(--display); font-size: .8rem; }
.chip.on { border-color: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 22%, transparent); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-weight: 700; font-size: .92rem; transition: transform .12s, background .12s, border-color .12s; }
.btn:hover { background: var(--panel-2); border-color: var(--muted); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: linear-gradient(135deg, var(--rose), var(--ember)); border-color: transparent; color: var(--ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.btn.small { padding: 6px 12px; font-size: .82rem; border-radius: 10px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* home */
.hero { padding-block: 28px 30px; display: grid; gap: 14px; }
.eyebrow { font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); font-weight: 700; }
.hero h1 { margin: 0; font-family: var(--display); font-weight: 900; font-size: clamp(2.6rem, 9vw, 5.6rem); line-height: .95; letter-spacing: -.01em; text-wrap: balance; }
.hero h1 em { font-style: normal; background: linear-gradient(90deg, var(--rose), var(--ember) 55%, var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { margin: 0; color: var(--muted); max-width: 60ch; font-size: 1.05rem; }
.hero .readout { font-family: var(--ipa); font-size: 1.35rem; color: var(--fg); }
.setup { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; padding: 16px; border-radius: 18px; background: color-mix(in srgb, var(--panel) 85%, transparent); border: 1px solid var(--line); margin-block-end: 26px; }
.setup .lbl { font-weight: 800; font-size: .9rem; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 8px 14px; cursor: pointer; font-weight: 700; font-size: .88rem; color: var(--muted); }
.seg button.on { background: var(--fg); color: var(--ink); }
.names { display: flex; flex-wrap: wrap; gap: 8px; }
.names input { width: 120px; max-width: 100%; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--ink-2); color: var(--fg); font: inherit; font-size: .9rem; }

.levels { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.lvl { position: relative; display: grid; grid-template-rows: auto auto 1fr auto; gap: 6px; text-align: left; padding: 18px; border-radius: 20px; background: color-mix(in srgb, var(--panel) 90%, transparent); border: 1px solid var(--line); cursor: pointer; min-height: 230px; overflow: hidden; transition: transform .18s, border-color .18s; }
.lvl:hover { transform: translateY(-3px); border-color: var(--ember); }
.lvl .glyph { font-family: var(--ipa); font-size: 3.4rem; line-height: 1; color: var(--gold); height: 74px; display: flex; align-items: center; }
.lvl .n { font-size: .74rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.lvl h3 { margin: 0; font-family: var(--display); font-size: 1.05rem; font-weight: 800; }
.lvl p { margin: 0; color: var(--muted); font-size: .9rem; }
.lvl .meta { display: flex; justify-content: space-between; align-items: center; font-size: .8rem; color: var(--muted); padding-top: 8px; border-top: 1px dashed var(--line); }
.stars { letter-spacing: 2px; color: var(--line); font-size: 1rem; }
.stars .lit { color: var(--gold); }
.lvl.boss { grid-column: 1 / -1; min-height: 0; grid-template-columns: auto 1fr auto; grid-template-rows: auto; align-items: center; gap: 22px;
  background: linear-gradient(110deg, color-mix(in srgb, var(--plum) 55%, var(--panel)), var(--panel) 60%); }
.lvl.boss .glyph { font-size: 4rem; height: auto; color: var(--fg); }
.lvl.boss .meta { border: 0; padding: 0; flex-direction: column; align-items: flex-end; gap: 4px; }
.lvl.wide { background: linear-gradient(90deg, var(--panel) 30%, color-mix(in srgb, var(--panel) 35%, transparent)), url("clips/b-2.png") right center / cover no-repeat, var(--panel); }
.lvl.wide .glyph { color: var(--gold); }

/* listening */
.players { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.play { display: inline-flex; align-items: center; gap: 12px; padding: 14px 22px; border-radius: 999px; border: 2px solid var(--line); background: var(--ink-2); cursor: pointer; font-weight: 800; font-size: 1.05rem; transition: border-color .12s, transform .12s; }
.play:hover { border-color: var(--ember); transform: translateY(-2px); }
.play.on { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 14%, var(--ink-2)); }
.bars { display: inline-flex; align-items: flex-end; gap: 3px; height: 20px; }
.bars i { width: 4px; height: 6px; border-radius: 2px; background: var(--ember); }
.play.on .bars i { animation: eq .5s ease-in-out infinite alternate; }
.play.on .bars i:nth-child(2) { animation-delay: .12s; } .play.on .bars i:nth-child(3) { animation-delay: .24s; } .play.on .bars i:nth-child(4) { animation-delay: .06s; }
@keyframes eq { from { height: 4px; } to { height: 20px; } }
.specbox { position: relative; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--ink); }
.specbox img { display: block; width: 100%; height: clamp(120px, 24vw, 220px); object-fit: fill; }
.specbox .ph { position: absolute; top: 0; bottom: 0; left: 0; width: 2px; background: var(--fg); box-shadow: 0 0 10px var(--gold); pointer-events: none; }
.specbox .khz { position: absolute; left: 8px; font-size: .7rem; color: var(--muted); background: color-mix(in srgb, var(--ink) 70%, transparent); padding: 1px 6px; border-radius: 6px; }
.specbox .top { top: 6px; } .specbox .bot { bottom: 6px; } .specbox .who { right: 8px; left: auto; top: 6px; color: var(--fg); }
.footnote { color: var(--muted); font-size: .85rem; margin-top: 18px; max-width: 70ch; }

/* play */
.playhead { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; justify-content: space-between; }
.playhead h2 { margin: 2px 0 0; font-family: var(--display); font-size: clamp(1.2rem, 3.4vw, 1.7rem); font-weight: 800; }
.turn { padding: 8px 14px; border-radius: 999px; background: var(--gold); color: var(--ink); font-weight: 800; font-size: .88rem; }
.progress { display: flex; gap: 5px; margin-block: 16px 14px; }
.progress i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.progress i.done { background: var(--ember); }
.progress i.now { background: var(--gold); }
.stage { position: relative; padding: clamp(18px, 4vw, 34px); border-radius: 24px; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); min-height: 280px; display: grid; gap: 22px; align-content: start; }
.q { margin: 0; font-size: clamp(1.05rem, 2.6vw, 1.3rem); font-weight: 700; text-wrap: balance; max-width: 62ch; }
.q .sub { display: block; font-weight: 500; color: var(--muted); font-size: .92rem; margin-top: 4px; }
.big-word { font-family: var(--ipa); font-style: italic; font-size: clamp(2.6rem, 8vw, 4.4rem); line-height: 1.05; }

/* spot the error */
.tokens { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; padding-block: 10px; }
.tok { font-family: var(--ipa); font-size: clamp(2rem, 7vw, 3.6rem); min-width: 1.4em; padding: 6px 10px 10px; border-radius: 14px; border: 2px solid transparent; background: var(--ink-2); cursor: pointer; line-height: 1.1; transition: transform .12s, border-color .12s, background .12s; }
.tok:hover { border-color: var(--muted); transform: translateY(-2px); }
.tok.brk { background: transparent; color: var(--muted); }
.tok.good { border-color: var(--good); background: color-mix(in srgb, var(--good) 20%, var(--ink-2)); }
.tok.bad { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 18%, var(--ink-2)); animation: shake .35s; }
.tok.reveal { border-color: var(--gold); border-style: dashed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.center { justify-content: center; }

/* transcription */
.tx { display: grid; gap: 14px; }
.tx-input { display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 16px; background: var(--ink-2); border: 2px solid var(--line); }
.tx-input:focus-within { border-color: var(--gold); }
.tx-input .br { font-family: var(--ipa); font-size: 2rem; color: var(--muted); }
.tx-input input { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--fg); font-family: var(--ipa); font-size: clamp(1.6rem, 5vw, 2.2rem); padding: 4px 0; outline: none; }
.kbd { display: grid; gap: 8px; }
.kbd .grp { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.kbd .grp span { font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); width: 84px; }
.key { font-family: var(--ipa); font-size: 1.35rem; min-width: 44px; height: 44px; padding: 0 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--ink-2); cursor: pointer; }
.key:hover { border-color: var(--gold); }
.key.wide { font-family: var(--ui); font-size: .85rem; font-weight: 700; padding: 0 12px; }
.diff { font-family: var(--ipa); font-size: 1.9rem; display: flex; flex-wrap: wrap; gap: 2px; }
.diff b { font-weight: 400; padding: 0 3px; border-radius: 6px; }
.diff .ok { color: var(--good); }
.diff .miss { background: color-mix(in srgb, var(--bad) 30%, transparent); color: var(--fg); }
.diff .need { background: color-mix(in srgb, var(--gold) 30%, transparent); }
.hint { color: var(--muted); font-size: .92rem; }

/* choices */
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.opts.text { grid-template-columns: 1fr; }
.opt { padding: 16px 14px; border-radius: 16px; border: 2px solid var(--line); background: var(--ink-2); cursor: pointer; text-align: center; transition: transform .12s, border-color .12s; }
.opt:hover { border-color: var(--ember); transform: translateY(-2px); }
.opt.ipa { font-family: var(--ipa); font-size: 2.3rem; line-height: 1.1; }
.opt.word { font-family: var(--ipa); font-style: italic; font-size: 1.6rem; }
.opt.text { text-align: left; font-size: 1rem; font-weight: 600; }
.opt.good { border-color: var(--good); background: color-mix(in srgb, var(--good) 20%, var(--ink-2)); }
.opt.bad { border-color: var(--bad); opacity: .55; animation: shake .35s; }
.opt[disabled] { cursor: default; transform: none; }
.steps { display: flex; gap: 8px; font-size: .8rem; color: var(--muted); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.steps b { color: var(--gold); }
.locked { font-family: var(--ipa); font-size: 1.3rem; color: var(--good); }

/* sorter */
.sorter { display: grid; gap: 18px; }
.card-zone { height: 130px; display: grid; place-items: center; position: relative; }
.wcard { font-family: var(--ipa); font-style: italic; font-size: clamp(2.2rem, 7vw, 3.4rem); padding: 14px 30px; border-radius: 18px; background: var(--fg); color: var(--ink); box-shadow: 0 14px 40px -12px color-mix(in srgb, var(--rose) 70%, transparent); animation: drop .35s cubic-bezier(.2,1.4,.4,1); transition: transform .35s ease-in, opacity .35s; }
.wcard.goL { transform: translate(-140%, 60px) rotate(-14deg) scale(.6); opacity: 0; }
.wcard.goR { transform: translate(140%, 60px) rotate(14deg) scale(.6); opacity: 0; }
.bins { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.bin { padding: 16px; border-radius: 18px; border: 2px dashed var(--line); background: var(--ink-2); cursor: pointer; text-align: center; display: grid; gap: 6px; min-height: 120px; align-content: start; transition: border-color .12s; }
.bin:hover { border-color: var(--gold); }
.bin .bt { font-weight: 800; }
.bin .bk { font-size: .75rem; color: var(--muted); }
.bin .pile { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
.bin .pile i { font-family: var(--ipa); font-size: .95rem; padding: 2px 8px; border-radius: 8px; background: var(--panel-2); }
.bin .pile i.y { box-shadow: inset 0 -2px 0 var(--good); }
.bin .pile i.n { box-shadow: inset 0 -2px 0 var(--bad); }
.toast { min-height: 1.6em; text-align: center; font-size: .95rem; }
.toast.ok { color: var(--good); } .toast.no { color: var(--bad); }

/* boss */
.timer { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
.timer i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--rose), var(--ember), var(--gold)); transform-origin: left; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { position: relative; padding: 22px 12px; border-radius: 16px; border: 0; cursor: pointer; font-size: 1.7rem; color: var(--ink); font-family: var(--ipa); font-weight: 700; transition: transform .12s, filter .12s, box-shadow .12s; }
.tile:nth-child(6n+1) { background: var(--rose); }
.tile:nth-child(6n+2) { background: var(--ember); }
.tile:nth-child(6n+3) { background: var(--gold); }
.tile:nth-child(6n+4) { background: var(--good); }
.tile:nth-child(6n+5) { background: #b48cf2; }
.tile:nth-child(6n+6) { background: #f2a3c4; }
.tile .k { position: absolute; top: 6px; left: 10px; font-family: var(--ui); font-size: .72rem; font-weight: 800; opacity: .6; }
.tile.word { font-style: italic; }
.tile.sel { transform: scale(.96); box-shadow: 0 0 0 4px var(--fg), 0 0 0 7px var(--ink); }
.tile.dim { filter: grayscale(.85) brightness(.55); }
.tile .mk { position: absolute; top: 6px; right: 10px; font-family: var(--ui); font-size: 1rem; font-weight: 900; }

/* feedback */
.fb { margin-top: 14px; padding: 16px 18px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); border-left: 6px solid var(--good); display: grid; gap: 6px; animation: rise .3s ease-out; }
.fb.no { border-left-color: var(--bad); }
.fb.mid { border-left-color: var(--gold); }
.fb .ft { font-weight: 800; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.fb .pts { font-family: var(--display); font-size: .9rem; color: var(--gold); }
.fb p { margin: 0; color: var(--fg); max-width: 75ch; }
.fb .ipa, .fb .w { font-size: 1.1em; }
.actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }

/* results */
.results { text-align: center; padding-block: 40px; display: grid; gap: 16px; justify-items: center; }
.results h2 { margin: 0; font-family: var(--display); font-size: clamp(2rem, 7vw, 3.4rem); }
.results .stars { font-size: 2.6rem; letter-spacing: 8px; }
.results .big { font-family: var(--display); font-size: 1.4rem; color: var(--gold); font-variant-numeric: tabular-nums; }
.board { display: grid; gap: 8px; width: min(420px, 100%); }
.board div { display: flex; justify-content: space-between; padding: 10px 16px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.board div:first-child { border-color: var(--gold); }

/* answer key */
.keyp { position: fixed; inset: 0; z-index: 10; background: color-mix(in srgb, var(--ink) 80%, transparent); backdrop-filter: blur(6px); overflow-y: auto; padding-inline: 16px; padding-block: 24px; }
.keyp .inner { max-width: 820px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: clamp(18px, 4vw, 32px); display: grid; gap: 18px; }
.keyp h2 { margin: 0; font-family: var(--display); font-size: 1.4rem; }
.keyp h3 { margin: 0; font-size: 1rem; color: var(--gold); letter-spacing: .04em; }
.keyp .intro { color: var(--muted); margin: 0; max-width: 70ch; }
.kl { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.kl li { display: grid; grid-template-columns: minmax(90px, auto) 1fr; gap: 4px 14px; padding: 8px 10px; border-radius: 10px; background: var(--ink-2); }
.kl li > :first-child { font-family: var(--ipa); font-style: italic; }
.kl .a { min-width: 0; }
.kl .a .ipa { font-size: 1.1em; }
.flag { grid-column: 1 / -1; font-size: .84rem; color: var(--ink); background: var(--gold); border-radius: 8px; padding: 4px 10px; }
.flag::before { content: "CHECK  "; font-weight: 800; letter-spacing: .08em; }

@keyframes shake { 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes drop { from { opacity: 0; transform: translateY(-30px) scale(.9); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-width: 560px) {
  .lvl.boss { grid-template-columns: 1fr; }
  .lvl.boss .meta { align-items: flex-start; }
  .kbd .grp span { width: 100%; }
  .bins { gap: 8px; }
  .kl li { grid-template-columns: 1fr; }
}
</style>

<canvas id="spec" aria-hidden="true"></canvas>
<div class="shade" aria-hidden="true"></div>
<div class="app">
  <header class="top">
    <button class="brand" data-act="home" aria-label="Back to level map"><b>Sound Lab</b><span>LING 313.02 · PS 2</span></button>
    <div class="top-right">
      <div class="scores" id="scores"></div>
      <button class="btn small ghost" id="soundBtn" data-act="sound">Sound on</button>
      <button class="btn small" data-act="key">Answer key</button>
    </div>
  </header>
  <main id="view"></main>
</div>
<div class="keyp" id="keyPanel" hidden></div>

<script>
/* ============ DATA ============ */
/* Notation follows the LING 313.02 handouts (W1-W4): /a/ = [ɑ]; stops and /ʧ/ are aspirated everywhere
   except syllable-finally; /h/ → [ç] only with [i]; /v/ → [β] and /f/ → [ɸ] next to rounded vowels;
   word-final /r/ → [ɾ̥]; fronting is marked with the plus sign below: [u̟], [ɑ̟], [o̟]. */
const SPOT = [
  { label: 'a', tokens: ['/', 'd', 'i', 'ɾ̥', 's', 'e', 'kʰ', '/'], wrong: [0, 3, 6, 7], correct: false,
    expl: 'The slashes mark a <b>phonemic</b> transcription. Devoicing (<span class="ipa">[ɾ̥]</span>) and aspiration (<span class="ipa">[kʰ]</span>) are allophonic details, so they only belong in a phonetic transcription in square brackets.',

/* ============ LEVEL 2: TRANSCRIBE ============ */
const segs = s => s.match(/.[̀-ͯʰ-˿]*/gu) || [];

  ['Vowels', ['ɑ', 'ɯ', 'y', 'ø', 'ɛ']],
  ['Marks', ['ʰ', '\u0325', 'ː', '\u031f']]
];
function rTrans(st, it) {
  txBlock(st, it, `
    <p class="q">Transcribe using phonetic symbols.<span class="sub">Type letters on your keyboard; use the keys below for IPA. Enter checks. Two tries.</span></p>
    <div class="big-word">${it.w}</div>`, it.w);
}
function txBlock(st, it, head, label, onDone) {
  let tries = 0, over = false;
  st.innerHTML = head + `
    <div class="tx">
      <div class="tx-input"><span class="br">[</span><input id="txIn" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your transcription of ${label}"><span class="br">]</span></div>
      <div class="kbd">${KEYS.map(([lab, ks]) => `<div class="grp"><span>${lab}</span>${ks.map(k => `<button class="key" data-k="${k}" aria-label="insert ${k}">${/[̀-ͯ]/.test(k) ? '◌' + k : k}</button>`).join('')}${lab === 'Marks' ? '<button class="key wide" data-k="BS">⌫ Delete</button>' : ''}</div>`).join('')}</div>
      <div id="txOut" class="hint"></div>
      <div class="row"><button class="btn primary" id="chk">Check</button><button class="btn ghost" id="give">Show answer</button></div>
    </div>`;
  const inp = $('#txIn'), out = $('#txOut');
  if (!onDone) setTimeout(() => inp.focus({ preventScroll: true }), 50);
  st.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
    if (over) return;
    const k = b.dataset.k, s = inp.selectionStart ?? inp.value.length, e = inp.selectionEnd ?? s;
    if (k === 'BS') {
      const before = inp.value.slice(0, s); const sg = segs(before); const cut = s === e ? (sg.length ? sg[sg.length - 1].length : 0) : 0;
      inp.value = inp.value.slice(0, s - cut) + inp.value.slice(e); inp.setSelectionRange(s - cut, s - cut);
    } else { inp.value = inp.value.slice(0, s) + k + inp.value.slice(e); inp.setSelectionRange(s + k.length, s + k.length); }

    if (reveal) html += `<div class="diff" aria-label="target">[${B.map((s, j) => `<b class="${mb.has(j) ? 'ok' : 'need'}">${s}</b>`).join('')}]</div>`;
    return html;

    const extra = isAlt ? ` Accepted. The model answer is <span class="ipa">[${canon}]</span>.` : (!good ? ` Target: <span class="ipa">[${canon}]</span>.` : '');
    const lead = onDone ? `<span class="w">${it.w}</span> <span class="ipa">[${canon}]</span>. ` : '';
    if (onDone) onDone();
    feedback(good ? 'ok' : 'no', good ? (tries === 0 ? 'Perfect transcription!' : 'Fixed it!') : 'Not this time', good ? p : null, lead + it.note + (onDone ? (isAlt ? ' Your variant is accepted.' : '') : extra));
  };

    if (over) return;

    const ok = [...it.a, ...(it.alt || [])].map(norm).includes(norm(v));

    inp.focus();

  $('#give').onclick = () => { if (!over) { tries = 2; done(false, inp.value); } };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); check(); } });
}

/* ============ PICK (Level 3 + Ex 6) ============ */

    <div class="row" style="justify-content:space-between"><span class="eyebrow" id="secs">${LIMIT}s</span><span class="hint">Perfect answer + time left = bonus</span></div>
    <div class="timer"><i id="bar"></i></div>
    <div class="tiles">${it.opts.map((o, i) => `<button class="tile ${it.kind === 'word' ? 'word' : ''}" data-i="${i}" aria-pressed="false"><span class="k">${i + 1}</span>${o}</button>`).join('')}</div>
    <div class="row center"><button class="btn primary" id="lock">Lock in</button></div>`;
  const tiles = [...st.querySelectorAll('.tile')];
  const toggle = i => { if (over) return; sel.has(i) ? sel.delete(i) : sel.add(i); tiles[i].classList.toggle('sel', sel.has(i)); tiles[i].setAttribute('aria-pressed', sel.has(i)); sTick(); };
  tiles.forEach((t, i) => t.onclick = () => toggle(i));
  const lock = () => {
    if (over) return; over = true; clearTimers(); keyHandler = null;
    const T = it.ans.length; let c = 0, w = 0;
    tiles.forEach((t, i) => {
      t.disabled = true; const isAns = it.ans.includes(i), picked = sel.has(i);
      if (isAns && picked) c++; if (!isAns && picked) w++;
      if (!isAns) t.classList.add('dim');
      t.insertAdjacentHTML('beforeend', `<span class="mk">${isAns ? (picked ? '✓' : '○') : (picked ? '✗' : '')}</span>`);
    });
    const perfect = c === T && w === 0;
    const base = Math.round(Math.max(0, c - w) / T * 200), bonus = perfect ? Math.round(left / LIMIT * 100) : 0;
    award(base + bonus);
    feedback(perfect ? 'ok' : base > 0 ? 'mid' : 'no', perfect ? `Perfect! +${bonus} speed bonus` : `${c} of ${T} found${w ? `, ${w} wrong pick${w > 1 ? 's' : ''}` : ''}`, base + bonus,
      it.why + ' <span class="hint">(○ = missed answer)</span>');
  };
  $('#lock').onclick = lock;
  keyHandler = e => { const n = parseInt(e.key, 10); if (n >= 1 && n <= it.opts.length) toggle(n - 1); if (e.key === 'Enter') { e.preventDefault(); lock(); } };
  const bar = $('#bar'), secs = $('#secs'); const t0 = performance.now();
  timers.push(setInterval(() => {
    left = Math.max(0, LIMIT - (performance.now() - t0) / 1000);
    bar.style.transform = `scaleX(${left / LIMIT})`; secs.textContent = Math.ceil(left) + 's';
    if (left <= 0) lock();
  }, 100));
}

/* ============ ANSWER KEY ============ */
function renderKey() {
  const li = (q, a, check) => `<li><span>${q}</span><span class="a">${a}</span>${check ? `<span class="flag">${check}</span>` : ''}</li>`;
  const ipa = s => `<span class="ipa">${s}</span>`;
  const p = $('#keyPanel');
  p.innerHTML = `<div class="inner" role="dialog" aria-label="Answer key">
    <div class="row" style="justify-content:space-between"><h2>Answer key</h2><button class="btn small" data-act="closekey">Close</button></div>
    <p class="intro">This is the key the game scores against. I drafted it from canonical descriptions of Turkish phonetics. Lines marked CHECK are judgment calls; tell me what to change and I will update the game.</p>
    <h3>Exercise 1 · Listening</h3><ul class="kl">${LISTEN.map(l => li(l.w, ipa('[' + l.a[0] + ']') + (l.alt ? ` <span class="hint">also accepted: ${l.alt.map(x => ipa('[' + x + ']')).join(', ')}</span>` : ''), l.check)).join('')}</ul>
    <h3>Exercise 2 · Spot the Error</h3><ul class="kl">${SPOT.map(s => li(ipa(s.tokens.join('')), s.key, s.check)).join('')}</ul>
    <h3>Exercise 3 · Boss Round</h3><ul class="kl">${BOSS.map(b => li(b.q.replace(/<[^>]+>/g, ''), b.ans.map(i => b.kind === 'ipa' ? ipa(b.opts[i]) : `<span class="w">${b.opts[i]}</span>`).join(', '), b.check)).join('')}</ul>
    <h3>Exercise 4 · Transcription</h3><ul class="kl">${TRANS.map(t => li(t.w, ipa('[' + t.a[0] + ']') + (t.alt ? ` <span class="hint">also accepted: ${t.alt.map(x => ipa('[' + x + ']')).join(', ')}</span>` : ''), t.check)).join('')}</ul>
    <h3>Exercise 5 · Articulation</h3><ul class="kl">${MATCH.map(m => li(m.title, ipa('[' + m.steps[0].opts[m.steps[0].ans] + ']') + ' · <span class="w">' + m.steps[1].opts[m.steps[1].ans] + '</span>')).join('')}</ul>
    <h3>Exercise 6 · Allophones</h3><ul class="kl">${ALLO.filter(a => a.type === 'pick').map(a => li(a.title + ' ' + a.focus, ipa('[' + a.steps[0].opts[a.steps[0].ans] + ']') + ' · ' + a.steps[1].opts[a.steps[1].ans])).join('')}</ul>
    <h3>Exercise 7 · Sorting</h3><ul class="kl">${ALLO.filter(a => a.type === 'sort').map((a, i) => li(a.short, a.words.filter(w => w[1]).map(w => `<span class="w">${w[0]}</span>`).join(', '), SORT_CHECKS[i])).join('')}</ul>
  </div>`;
  p.hidden = false; p.querySelector('[data-act="closekey"]').focus();
}

/* ============ GLOBAL ACTIONS ============ */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'home') renderHome();
  if (act === 'key') renderKey();
  if (act === 'closekey') $('#keyPanel').hidden = true;
  if (act === 'reset') { state.teams.forEach(t => t.score = 0); state.done = {}; state.turn = 0; renderHome(); }
  if (act === 'sound') { state.sound = !state.sound; a.textContent = state.sound ? 'Sound on' : 'Sound off'; }
});
$('#keyPanel').addEventListener('click', e => { if (e.target.id === 'keyPanel') e.currentTarget.hidden = true; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#keyPanel').hidden = true; });

/* ============ BOOT (keeps scores across live updates) ============ */
function start(data) {
  if (data && data.teams) { state.mode = data.mode; state.names = data.names; state.teams = data.teams; state.done = data.done || {}; state.sound = data.sound !== false; }
  $('#soundBtn').textContent = state.sound ? 'Sound on' : 'Sound off';
  renderHome();
}
window.claude?.hot?.snapshot?.(() => ({ mode: state.mode, names: state.names, teams: state.teams, done: state.done, sound: state.sound }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

</html>
